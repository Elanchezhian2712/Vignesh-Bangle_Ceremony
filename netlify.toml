[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path serves the invitation, so personalised
# links like /?to=Meena and any future routes resolve correctly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
